name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Test using Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable --inline-builds

      - name: Test library
        run: yarn test --scope '@grafana/scenes-ml'

      - name: Typecheck library
        run: yarn typecheck --scope '@grafana/scenes-ml'

      - name: Build library
        run: yarn build --scope '@grafana/scenes-ml'

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Get GitHub App Token
        id: get-github-app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: scenes-repo-bot-access-token

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.get-github-app-token.outputs.token }}

      - name: Prepare repository
        run: git fetch --unshallow --tags

      - name: Enable Corepack
        run: corepack enable

      - name: Test using Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable --inline-builds

      - name: Build library
        run: yarn run lerna run build --no-private

      - name: Run auto shipit
        run: yarn auto shipit
        env:
          GITHUB_TOKEN: ${{ steps.get-github-app-token.outputs.token }}
